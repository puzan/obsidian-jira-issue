name: Create new release on new tag

on:
  push:
    tags:
      - "*"
  # Triggered by "Manually create release": tags pushed with GITHUB_TOKEN don't fire push events
  workflow_dispatch:

env:
  PLUGIN_NAME: obsidian-jira-issue

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Build
        id: build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          echo "tag_name=$(git tag --sort version:refname | tail -n 1)" >> $GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./main.js
            ./manifest.json
            ./styles.css

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./main.js
            ./manifest.json
            ./styles.css
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
